[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okf-knowledgebase"
version = "0.2.0"
description = "Open Knowledge Format (OKF) knowledge base framework, query engine, visualizer, and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
okf-kb = "okf_kb.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/okf_kb"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
